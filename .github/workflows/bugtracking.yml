name: Triaje de issues con Jev

on:
  issues:
    types: [opened, edited] # Añadida la opción edited por si el bug se edita

# Permisos mínimos: leer el repo y escribir etiquetas en las issues.
permissions:
  contents: read
  issues: write
  pull-requests: none # explicito por seguridad

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: ISSUE TRIAGE
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python triage.py